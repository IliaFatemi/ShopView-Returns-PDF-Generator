<!DOCTYPE html>
<html>
  <head>
    <title>Intercepted Requests</title>
    <script src="libs/jsPDF/dist/jspdf.umd.min.js"></script>
    <script src="libs/jsPDF-AutoTable/dist/jspdf.plugin.autotable.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 10px;
        width: 400px;
      }
      #intercepted-requests {
        margin-top: 10px;
        white-space: pre-wrap;
        background: #f5f5f5;
        padding: 10px;
        border-radius: 5px;
        max-height: 200px;
        overflow-y: auto;
      }
      button {
        margin-top: 10px;
        padding: 5px 10px;
        font-size: 14px;
        cursor: pointer;
      }
      #pdf-preview {
        width: 100%;
        height: 400px; /* Adjust height as needed */
        border: 1px solid #ccc;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h1>PDF Preview</h1>
    <button id="download-pdf">Download PDF</button>
    <iframe id="pdf-preview"></iframe>
    <script src="popup.js"></script>
  </body>
</html>
